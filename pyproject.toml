readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.8",
    "google-genai>=1.75.0",
    "llama-index>=0.14.21",
    "llama-index-embeddings-ollama>=0.9.0",
    "llama-index-llms-gemini>=0.6.2",
    "llama-index-llms-ollama>=0.10.1",
    "llama-index-readers-file>=0.6.0",
    "llama-index-vector-stores-chroma>=0.5.5",
    "openai>=2.32.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.56.0",
    "tiktoken>=0.12.0",
]
