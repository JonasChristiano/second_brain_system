name: Dev Tests and Open PR to Main

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  pull-requests: write

jobs:
  tests:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests -v

  open_pr_if_green:
    name: Open PR dev -> main
    runs-on: ubuntu-latest
    needs: tests
    if: success()

    steps:
      - name: Create or reuse PR
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = 'dev';
            const base = 'main';

            const { data: openPulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${head}`,
              base,
              per_page: 10,
            });

            if (openPulls.length > 0) {
              core.info(`PR já existe: #${openPulls[0].number} (${openPulls[0].html_url})`);
              return;
            }

            const { data: pr } = await github.rest.pulls.create({
              owner,
              repo,
              title: 'chore: merge dev into main',
              head,
              base,
              body: [
                'PR criado automaticamente após sucesso dos testes em `dev`.',
                '',
                `Workflow run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              ].join('\n'),
              maintainer_can_modify: true,
            });

            core.info(`PR criado: #${pr.number} (${pr.html_url})`);
